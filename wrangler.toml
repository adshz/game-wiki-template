# ⚠️⚠️⚠️ FORKERS READ THIS FIRST ⚠️⚠️⚠️
#
# This is a Cloudflare Workers (Static Assets) config, not Pages. Workers
# doesn't build your site — `wrangler deploy` just uploads an already-built
# dist/ — so unlike the old Pages setup, there is no [vars] block here to
# edit. Configure PUBLIC_*/SITE_URL env vars in ONE of:
#   (A) .env (local builds — copy .env.example, see docs/deployment.md), OR
#   (B) GitHub Actions repository Variables (CI/CD builds — see cd.yml)
#
# Rename `name` below to your own project name before deploying — "anvilwiki"
# is the demo site's Worker name, reusing it will deploy over the demo.
#
# See docs/deployment.md for the full guide, including why this replaced
# Cloudflare Pages (Pages' directory-format static asset serving always
# 308-redirects a bare path to add a trailing slash, regardless of Astro's
# trailingSlash:'never' — html_handling below is the documented fix).
# ⚠️⚠️⚠️ END FORKER WARNING ⚠️⚠️⚠️

# Usage:
#   pnpm build
#   npx wrangler dev     # local preview
#   npx wrangler deploy  # deploy
#
# Reference: https://developers.cloudflare.com/workers/static-assets/

name = "anvilwiki"
compatibility_date = "2026-08-17"

[assets]
directory = "./dist"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
