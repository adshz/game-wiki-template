name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup installs pnpm WITHOUT running it, so it works
      # even before Node is configured (uses the runner's default Node 24).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Config consistency (nav/locale 3-place check)
        run: pnpm check-config
        env:
          # This used to fall back to wrangler.toml's [vars] SITE_URL, which
          # no longer exists now that Pages' build-time [vars] injection was
          # replaced by the Workers + GitHub Actions flow (see cd.yml).
          SITE_URL: ${{ vars.SITE_URL || 'https://anvilwiki.pages.dev' }}

      - name: Build
        run: pnpm build
        env:
          # FORKS: set these as repository Variables (Settings → Secrets and
          # variables → Actions → Variables), not in wrangler.toml — Workers
          # doesn't build your site (wrangler deploy just uploads an
          # already-built dist/), so wrangler.toml [vars] no longer feeds the
          # Astro build the way it did under Cloudflare Pages' Git-connect
          # flow. Everything below is optional except SITE_URL; empty =
          # that feature stays disabled, matching .env.example's defaults.
          SITE_URL: ${{ vars.SITE_URL || 'https://anvilwiki.pages.dev' }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_STICKY: ${{ vars.PUBLIC_ADSENSE_SLOT_STICKY }}
          PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ vars.PUBLIC_ADSENSE_SLOT_SIDEBAR }}
          PUBLIC_ADSENSE_SLOT_INCONTENT: ${{ vars.PUBLIC_ADSENSE_SLOT_INCONTENT }}
          PUBLIC_SPONSOR_URL: ${{ vars.PUBLIC_SPONSOR_URL }}
          PUBLIC_SPONSOR_IMAGE_URL: ${{ vars.PUBLIC_SPONSOR_IMAGE_URL }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION }}
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          PUBLIC_GISCUS_MAPPING: ${{ vars.PUBLIC_GISCUS_MAPPING || 'pathname' }}

      - name: Content lint (H1/alt/slashes)
        run: pnpm check-content

      - name: Internal link audit (dist/)
        run: pnpm check-links

      - name: i18n coverage (report only)
        run: pnpm check-i18n

      # Consumed by cd.yml, which is triggered by this workflow's
      # completion — CI never deploys itself, see cd.yml for that half.
      - name: Upload build output
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
